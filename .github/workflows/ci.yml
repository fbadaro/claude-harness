name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck harness/*.sh harness/pre-push install.sh test/run.sh
      - name: tests
        shell: bash
        run: |
          jq --version
          bash --version | head -1
          bash test/run.sh
